<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 200px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 12px; }
  label { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .switch { position: relative; width: 38px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #bbb; border-radius: 22px; transition: .15s; }
  .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  input:checked + .slider { background: #e5383b; }
  input:checked + .slider::before { transform: translateX(16px); }
  .count { margin-top: 12px; color: #555; }
  .count b { color: #222; }
</style>
</head>
<body>
  <h1>Max Combo Hide</h1>
  <label>
    <span>Hide Max Combo</span>
    <span class="switch"><input id="toggle" type="checkbox"><span class="slider"></span></span>
  </label>
  <div class="count" id="count">Not an AliExpress page</div>
  <script src="popup.js"></script>
</body>
</html>
